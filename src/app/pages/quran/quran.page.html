<ion-header>
  <ion-toolbar>
    <ion-title>القرآن الكريم</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="quran-hub-content">
  <p class="hub-intro">Choose how you want to read the Quran.</p>

  <section class="quran-mode-section" aria-label="Quran reading modes">
    <div class="quran-mode-cards">
      <a class="quran-mode-card" routerLink="/quran/surahs">
        <span class="mode-icon" aria-hidden="true">📖</span>
        <span class="mode-title">Read by Surah</span>
        <span class="mode-desc">Ayah-by-ayah with translation</span>
        <span class="mode-action">Open surah list ›</span>
      </a>
      <a class="quran-mode-card" routerLink="/quran/mushaf">
        <span class="mode-icon" aria-hidden="true">📕</span>
        <span class="mode-title">15 Line Quran</span>
        <span class="mode-desc">Page-by-page mushaf reading</span>
        <span class="mode-action">Open mushaf ›</span>
      </a>
    </div>
  </section>
</ion-content>
