<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/quran" text="Quran"></ion-back-button>
    </ion-buttons>
    <ion-title>15 Line Quran</ion-title>
  </ion-toolbar>
  <ion-toolbar class="search-toolbar">
    <div class="surah-search-field" role="search">
      <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
      <input
        type="search"
        class="surah-search-input"
        placeholder="Search surahs…"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        autocomplete="off"
        spellcheck="false"
      />
      <button
        *ngIf="searchTerm"
        type="button"
        class="surah-search-clear"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        <ion-icon name="close-circle" aria-hidden="true"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="mushaf-list-content">
  <p class="mushaf-intro">Choose a surah to open it in mushaf page view.</p>

  <div *ngIf="loading" class="surah-list">
    <div class="surah-card skeleton" *ngFor="let _ of skeletons()">
      <ion-skeleton-text animated style="width:36px;height:36px;border-radius:50%;"></ion-skeleton-text>
      <div class="skeleton-text">
        <ion-skeleton-text animated style="width:60%;height:14px;border-radius:6px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:40%;height:12px;border-radius:6px;margin-top:6px;"></ion-skeleton-text>
      </div>
    </div>
  </div>

  <div class="surah-list" *ngIf="!loading">
    <a
      class="surah-card"
      *ngFor="let c of filtered"
      [routerLink]="['/quran/mushaf', c.id]"
      [state]="{ mushafChapter: c }"
    >
      <div class="surah-number-badge">
        <span class="num">{{ c.id }}</span>
      </div>
      <div class="surah-info">
        <div class="surah-english">{{ c.nameSimple }}</div>
        <div class="surah-translation">{{ c.translatedName }}</div>
        <div class="surah-meta">
          <span class="revelation-type" [class.meccan]="c.revelationPlace === 'Meccan'">{{ c.revelationPlace }}</span>
          <span class="ayah-count">{{ c.versesCount }} Ayahs</span>
          <span class="page-range">{{ pageRangeLabel(c) }}</span>
        </div>
      </div>
      <div class="surah-arabic-name">{{ c.nameArabic }}</div>
    </a>

    <div class="empty-state" *ngIf="filtered.length === 0">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">No surahs found</div>
    </div>
  </div>

  <div style="height: 24px"></div>
</ion-content>
